name: Предложение / Feature request
description: Новая функция или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
  - type: checkboxes
    id: permissions
    attributes:
      label: Разрешения
      options:
        - label: Предложение требует новых разрешений Chrome (tabs, sidePanel, постоянный доступ к сайтам и т. п.)

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Verify packaged manifest and resources
        run: python scripts/verify-package.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cookiess-install-zip
          path: artifacts/cookiess-*.zip
          if-no-files-found: error
          retention-days: 14


  browser:
    name: Real installed popup (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cookiess-install-zip
          path: artifacts
      - run: python scripts/unpack-test-package.py
      - name: Remove old screenshot evidence from the checkout
        run: python -c "import shutil; from pathlib import Path; shutil.rmtree('screenshots'); Path('screenshots').mkdir()"
      - run: npx playwright install --with-deps chromium
      - name: Install Linux native UI tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick
      - name: Linux full native-popup suite against install ZIP
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:browser
        env:
          EXTENSION_PATH: test-output/unpacked
      - name: Windows native-popup loading and navigation
        if: runner.os == 'Windows'
        run: node scripts/popup-smoke.mjs
        env:
          EXTENSION_PATH: test-output/unpacked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            screenshots/*.png
            screenshots/browser-results.json
            test-output/*.json
            test-output/*.png
          retention-days: 14

  release:
    name: Update latest-build release
    needs: [verify, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cookiess-install-zip
          path: artifacts
      - name: Publish verified ZIP
        run: bash scripts/publish-latest.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}

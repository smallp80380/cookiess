version: 2
# Monthly, and related packages arrive together in one pull request, so each PR can be
# installed and tested on its own (eslint with @eslint/js, vitest with its coverage plugin).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Vite 8's Oxc minifier inlines tldts' public-suffix trie constants and doubles the popup
      # bundle (186 KB -> 326 KB). Revisit when that is fixed; see ROADMAP.md.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      # typescript-eslint 8.72 supports TypeScript >=4.8.4 <6.1.0; a TypeScript major breaks
      # npm install until typescript-eslint ships support. Revisit then; see ROADMAP.md.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      lint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'globals', 'prettier']
      test:
        patterns: ['vitest', '@vitest/*', 'playwright']
      build:
        patterns: ['vite', 'typescript', '@types/*']
      runtime:
        patterns: ['tldts']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Stamp build number into version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - run: npm run typecheck
      - run: npm run lint
      - name: Check formatting (Linux; Windows checkouts use CRLF)
        if: runner.os == 'Linux'
        run: npm run format:check
      - run: npm run test:coverage
      - run: npm run package
      - name: Verify packaged manifest and resources
        run: python scripts/verify-package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cookiess-install-zip
          path: artifacts/cookiess-*.zip
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Real installed popup (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Stamp build number into version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cookiess-install-zip
          path: artifacts
      - run: python scripts/unpack-test-package.py
      - name: Remove old screenshot evidence from the checkout
        run: python -c "import shutil; from pathlib import Path; shutil.rmtree('screenshots'); Path('screenshots').mkdir()"
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install Linux native UI tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick
      - name: Linux full native-popup suite against install ZIP
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:browser
        env:
          EXTENSION_PATH: test-output/unpacked
      - name: Windows native-popup loading and navigation
        if: runner.os == 'Windows'
        run: node scripts/popup-smoke.mjs
        env:
          EXTENSION_PATH: test-output/unpacked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            screenshots/*.png
            screenshots/browser-results.json
            test-output/*.json
            test-output/*.png
          retention-days: 14

  release:
    name: Publish release
    needs: [verify, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Stamp build number into version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cookiess-install-zip
          path: artifacts
      - name: Publish verified ZIP
        run: bash scripts/publish-latest.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}

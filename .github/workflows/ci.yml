name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      # Before stamping: the stamp rewrites manifest.json with JSON.stringify formatting.
      - name: Check formatting (Linux; Windows checkouts use CRLF)
        if: runner.os == 'Linux'
        run: npm run format:check
      - name: Stamp build number into version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run package
      - name: Verify packaged manifest and resources
        run: python scripts/verify-package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cookiess-install-zip
          path: artifacts/cookiess-*.zip
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Real installed popup (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Stamp build number into version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cookiess-install-zip
          path: artifacts
      - run: python scripts/unpack-test-package.py
      - name: Remove old screenshot evidence from the checkout
        run: python -c "import shutil; from pathlib import Path; shutil.rmtree('screenshots'); Path('screenshots').mkdir()"
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install Linux native UI tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick
      - name: Linux full native-popup suite against install ZIP
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:browser
        env:
          EXTENSION_PATH: test-output/unpacked
      - name: Windows native-popup loading and navigation
        if: runner.os == 'Windows'
        run: node scripts/popup-smoke.mjs
        env:
          EXTENSION_PATH: test-output/unpacked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: |
            screenshots/*.png
            screenshots/browser-results.json
            test-output/*.json
            test-output/*.png
          retention-days: 14

  release:
    name: Publish release
    needs: [verify, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Stamp build number into version
        run: node scripts/stamp-version.mjs ${{ github.run_number }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cookiess-install-zip
          path: artifacts
      - name: Publish verified ZIP
        run: bash scripts/publish-latest.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
